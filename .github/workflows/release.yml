name: Release

# Every merge to main that changes a skill publishes a new GitHub release:
# the next version tag, one zip per skill, a tarball of all skills, and checksums.
# Claude Code plugin users and `npx skills` users track main directly, so this
# release is for pinning a version and for manual downloads (e.g. claude.ai uploads).
# Run it by hand to publish a minor or major version instead of a patch.

on:
  push:
    branches: [main]
    paths:
      - "skills/**"
      - ".claude-plugin/**"
  workflow_dispatch:
    inputs:
      bump:
        description: "Which part of the version to increase"
        type: choice
        options: [patch, minor, major]
        default: patch

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  release:
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the tag and the release
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Pick the next version
        id: version
        env:
          BUMP: ${{ inputs.bump || 'patch' }}
        run: |
          latest="$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n 1)"
          if [ -z "$latest" ]; then
            next="v1.0.0"
          else
            IFS=. read -r major minor patch <<<"${latest#v}"
            case "$BUMP" in
              major) next="v$((major + 1)).0.0" ;;
              minor) next="v${major}.$((minor + 1)).0" ;;
              *)     next="v${major}.${minor}.$((patch + 1))" ;;
            esac
          fi
          echo "Releasing $next (previous: ${latest:-none})"
          echo "tag=$next" >> "$GITHUB_OUTPUT"

      - name: Build release archives
        run: python3 scripts/package_skills.py --out dist

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release create "$TAG" dist/* \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --generate-notes
